name: CI

# ============================================================================
# LiteMonitorPlus 最小可用 CI（审计项 BASE-004 / 假绿禁令 G3）
#
# ★ 本仓库此前**完全没有 CI**。在测试工程进入解决方案之前，
#   `dotnet test LiteMonitor.sln` 会静默空跑并返回退出码 0，
#   于是"Unit Test"这一步恒为绿，却一个用例都没跑（G3 假绿）。
#
# ★ 本工作流的核心不是"跑 dotnet test"，而是**强制校验发现了多少条用例**：
#   断言脚本 .github/workflows/assert-test-counts.ps1 会逐程序集核对
#   总计/通过/失败/跳过，任何一个程序集"0 发现"、缺程序集、或总数低于阈值，
#   都会让 job 以非零退出码失败。
#
# ★ 行尾说明：本仓库 core.autocrlf=true 且仓库根目录**没有 .gitattributes**。
#   windows-latest runner 的系统 gitconfig 同样是 autocrlf=true，
#   检出行为与本地一致（文本文件 CRLF），因此脚本按 LF 提交的写法在 runner 上照常工作，
#   无需额外的 .gitattributes 或 actions/checkout 的 crlf 设置。
#
#   ★ 例外：tests/fixtures/plugin-repo/ 目录**自带**一个局部 .gitattributes
#     （*.json text eol=lf）。插件市场契约测试要对 plugin.json 的**原始字节**求
#     SHA-256 与长度，CRLF 转换会让字节口径与 index.json 里的 sha256 / size 对不上。
#     该 .gitattributes 只作用于该子目录，不影响仓库其它文件。
# ============================================================================

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# 最小权限：CI 只需要读代码 + 上传 artifact，不需要写仓库内容
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: 构建 / 测试 / 打包
    # net8.0-windows + <PlatformTarget>x64</PlatformTarget> + win-x64 RID
    #   ⇒ 只能在 Windows runner 上构建
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # ★★ 用例发现数下限（防假绿的核心阈值）★★
      #    改动这个值必须是**有意**的（例如新增测试工程后调高），
      #    绝不允许为了"让流水线变绿"而调低。
      #    当前基线：1316（1239 + 58 + 19），阈值 1316（**等于**当前实测总数——
      #    门禁只收紧不放宽：任何用例被删或被跳过都会让本行变红）。
      #    历史：1185（1153+13+19）/阈值 1150 → 1270（1193+58+19）/阈值 1150
      #    → 1280（1203+58+19）/阈值 1280（S3.5 + S3.6 + 主审集成落地）
      #    → 1281（1204+58+19）/阈值 1281（LM-047 原语层夹取 + 1 条护栏用例）
      #    → 1316（1239+58+19）/阈值 1316（LM-045 两侧逐跳复核 22 条 + owner A 物化 14 条）。
      #    ★ release.yml 的同名阈值必须与本行**逐字一致**（2026-10-23 主审更正 LM-056：
      #      原先 release.yml 写着 1000 ⇒ 删掉 281 条用例时 CI 会红、**发布流水线却会绿**）。
      MIN_TEST_TOTAL: 1349

      # ★ 必须出现的测试程序集。少任何一个都会让断言失败
      #   （防止某个测试工程悄悄没被测到）。
      EXPECTED_TEST_ASSEMBLIES: 'LiteMonitor.Tests, LiteMonitor.Updater.Tests, LiteMonitor.GpuNonperformance.Tests'

      # ★ 跳过用例数上限（防"静默跳过"，S4.1 起收紧）。
      #    允许跳过的**只有**联网 E2E（MarketE2ETests，门控 LITEMONITOR_E2E=1，
      #    CI 故意不设该变量）—— 插件市场契约用例**不允许**再被跳过。
      #    接入夹具前基线是 7 条跳过（6 契约 + 1 E2E），现在必须是 1 条。
      MAX_SKIPPED_TESTS: 1

      # ★ 必须真正执行的测试类（ENV-003 收口）。
      #    插件市场的 6 条契约用例由 LITEMONITOR_PLUGIN_REPO 门控：
      #    夹具路径一旦失效，它们会被 xunit 记为 Skipped 而不是失败 ——
      #    这里把它们钉成硬门禁："必须被发现、必须不少于 6 条、必须一条都没被跳过"。
      MUST_EXECUTE_TEST_CLASS: 'MarketIndexContractTests'
      MUST_EXECUTE_TEST_CLASS_MIN_COUNT: 6

      # ★ 插件市场契约夹具路径（S4.1 引入，仓库内固定路径）。
      #    tests/fixtures/plugin-repo 是 awesome-litemonitor-plugins 的最小本地副本，
      #    让 MarketIndexContractTests 的 6 条用例在 CI 里**真正执行**（而不是被跳过）。
      #    该目录自带 .gitattributes（*.json text eol=lf），
      #    保证 index.json 里记录的 sha256 / size 与 plugin.json 的原始字节
      #    在 Windows runner 上完全一致（否则字节口径对不上，契约必然失败）。
      LITEMONITOR_PLUGIN_REPO: ${{ github.workspace }}/tests/fixtures/plugin-repo

      # ★ 故意**不**设置 LITEMONITOR_E2E=1：联网 E2E 单独跑，不进 PR 门禁。
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 还原依赖
        run: dotnet restore LiteMonitor.sln

      - name: 构建（Debug）
        run: dotnet build LiteMonitor.sln -c Debug --nologo

      # ★ 第三方组件声明与实际依赖一致（LM-024 护栏，S5.3/S5.3b 引入）★
      #   脚本以**实际解析**的依赖为真值（还原图 + 目标框架冲突消解），
      #   核对 NOTICE 里声明的组件清单：
      #     · 直接依赖漏列 / 版本不符   ⇒ 退出码 1（流水线红）
      #     · 传递依赖漏列 / 版本不符   ⇒ 退出码 1（流水线红）
      #     · 环境受阻（取不到还原图等）⇒ 退出码 3（流水线红，结论不可信时不放行）
      #   LM-024 的根因就是"手工维护的清单必然漂移"——本步骤把一次性修正
      #   变成可持续的门禁：以后新增依赖而忘记改 NOTICE，会在这里被挡住。
      - name: 校验第三方组件声明与实际依赖一致（LM-024 护栏）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'scripts/generate-dependency-manifest.ps1' -Mode Check
          if ($LASTEXITCODE -ne 0) { throw "依赖清单核对失败（退出码 $LASTEXITCODE）" }

      - name: 清理历史测试结果
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 清掉上一次运行遗留的 TRX，保证下面"每个程序集一份结果"是干净的
          Get-ChildItem -Path 'tests' -Filter 'TestResults' -Directory -Recurse -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force
          New-Item -ItemType Directory -Force -Path 'ci-artifacts' | Out-Null
          Write-Host '已清理历史 TestResults 目录'

      - name: 运行单元测试
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:GITHUB_WORKSPACE 'ci-artifacts\test-console.log'
          # TRX 落在每个测试工程自己的 TestResults 目录，文件名固定为 results.trx，
          # 三个工程各写各的目录，不会互相覆盖。
          dotnet test LiteMonitor.sln -c Debug --nologo --logger "trx;LogFileName=results.trx" |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Host "dotnet test 退出码: $code"
          if ($code -ne 0) { throw "dotnet test 失败（退出码 $code）" }

      - name: 强制校验测试发现数（防假绿）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assertArgs = @(
            '-NoProfile',
            '-File', '.github/workflows/assert-test-counts.ps1',
            '-TrxRoot', 'tests',
            '-MinTotal', $env:MIN_TEST_TOTAL,
            '-ExpectedAssembly', $env:EXPECTED_TEST_ASSEMBLIES,
            '-MaxSkipped', $env:MAX_SKIPPED_TESTS,
            '-MustExecuteTestClass', $env:MUST_EXECUTE_TEST_CLASS,
            '-MustExecuteTestClassMinCount', $env:MUST_EXECUTE_TEST_CLASS_MIN_COUNT
          )
          # 以子进程方式调用：脚本里的 Set-StrictMode / exit 不会污染本步骤
          & pwsh @assertArgs
          if ($LASTEXITCODE -ne 0) { throw "测试发现数断言失败（退出码 $LASTEXITCODE）" }

      - name: 构建（Release）
        run: dotnet build LiteMonitor.sln -c Release --nologo

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $json = Get-Content -LiteralPath 'resources/version.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $v = [string]$json.version
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'resources/version.json 里没有 version 字段' }
          Write-Host "版本号: $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 打包发布件并计算 SHA-256
        shell: pwsh
        env:
          PACK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:PACK_VERSION
          Write-Host "打包版本: $version"
          & pwsh -NoProfile -File 'scripts/pack-release.ps1' -Version $version -Brand 'LiteMonitorPlus' -OutDir 'dist'
          if ($LASTEXITCODE -ne 0) { throw "pack-release.ps1 失败（退出码 $LASTEXITCODE）" }
          $zip = "dist/LiteMonitorPlus_v$version-win-x64.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "发布包缺失: $zip" }
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item -LiteralPath $zip).Length
          Write-Host "ZIP    : $zip"
          Write-Host ("大小   : {0:N2} MB" -f ($size / 1MB))
          Write-Host "SHA256 : $sha"
          "sha256=$sha" >> $env:GITHUB_OUTPUT

      - name: 上传测试报告（TRX + 控制台日志）
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/TestResults/*.trx
            ci-artifacts/test-console.log
          if-no-files-found: error
          retention-days: 14

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/LiteMonitorPlus_v${{ steps.version.outputs.version }}-win-x64.zip
          if-no-files-found: error
          retention-days: 14
