name: CI

# ============================================================================
# LiteMonitorPlus 最小可用 CI（防假绿门禁）
#
# PR 运行 Debug/Release 的 1..3 档。目录工具实际发现所有测试并检查固定基线，
# 然后将所选用例与本次 TRX 逐行核对，拒绝漏跑、重复和跳过。
# 桌面/硬件/GPU/压力验证见 extended-tests.yml；发布要求离线五档。
#
# ★ 行尾说明：本仓库 core.autocrlf=true，且仓库根目录**已有** .gitattributes
#   （文本 text eol=crlf、二进制 binary、契约夹具区 eol=lf 显式例外）。
#   windows-latest runner 的系统 gitconfig 同样是 autocrlf=true，
#   检出行为与本地一致（文本文件 CRLF），因此脚本按 LF 提交的写法在 runner 上照常工作，
#   无需 actions/checkout 的 crlf 设置。
#
#   ★ 例外：tests/fixtures/plugin-repo/ 目录**自带**一个局部 .gitattributes
#     （*.json / *.md text eol=lf），且根 .gitattributes 对该目录显式声明 eol=lf。
#     插件市场契约测试要对 plugin.json 的**原始字节**求
#     SHA-256 与长度，CRLF 转换会让字节口径与 index.json 里的 sha256 / size 对不上。
#     该 .gitattributes 只作用于该子目录，不影响仓库其它文件。
# ============================================================================

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

# 最小权限：CI 只需要读代码 + 上传 artifact，不需要写仓库内容
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: 构建 / 测试 / 打包
    # net8.0-windows + <PlatformTarget>x64</PlatformTarget> + win-x64 RID
    #   ⇒ 只能在 Windows runner 上构建
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # 五档门禁使用固定基线与逐条 TRX 对账（assert-test-tiers.ps1）。
      # 新入口不允许所选测试出现 Skip，未启用能力另列为排除。
      LITEMONITOR_PLUGIN_REPO: ${{ github.workspace }}/tests/fixtures/plugin-repo
      LITEMONITOR_THEME_REPO: ${{ github.workspace }}/tests/fixtures/theme-repo
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 还原依赖
        run: dotnet restore LiteMonitor.sln

      - name: 构建（Debug）
        shell: pwsh
        run: |
          & pwsh -NoProfile -File 'scripts/run-tests.ps1' -Configuration Debug -BaseOutputPath bin/ -BuildOnly
          if ($LASTEXITCODE -ne 0) { throw "构建或产物身份记录失败（退出码 $LASTEXITCODE）" }

      # ★ 生产主窗体启动检查★
      # 纯单测**证明不了**主程序能不能启动："主窗体构造即抛
      #   NullReferenceException"属于**启动阻断**缺陷——它能穿过全部单测，
      #   因为没有任何用例真的构造过生产 MainForm。
      #   ⇒ 这里真的把生产 MainForm 构造出来（探针场景 `startup`）。
      #   退出码契约（tools/GpuHostLifecycleProbe）：
      #     0 = 构造成功；1 = 构造抛异常（**真实缺陷 ⇒ 本步骤红**）。
      #   该场景刻意**不跑消息循环**（不触发 OnShown）⇒ 网页服务不会开始监听。
      - name: 生产主窗体启动检查（真实构造 MainForm）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 独立 BaseOutputPath：全局属性级联到全部被引用工程，避免这次构建重写
          # BuildOnly 记录的构建身份所锚定的根 bin/Debug（check-stamp 会比对产物 hash）。
          dotnet build tools/GpuHostLifecycleProbe/GpuHostLifecycleProbe.csproj -c Debug --nologo -v quiet -p:BaseOutputPath=bin/probe/
          if ($LASTEXITCODE -ne 0) { throw "探针构建失败（退出码 $LASTEXITCODE）" }
          $out = Join-Path $env:GITHUB_WORKSPACE 'ci-artifacts\startup-check'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $probe = 'tools\GpuHostLifecycleProbe\bin\probe\Debug\net8.0-windows\GpuHostLifecycleProbe.exe'
          # ★★ 探针是 WinExe（GUI 子系统）★★：PowerShell 的 `&` 对 GUI 程序
          #   **不等待**、**不更新** $LASTEXITCODE；而上一步 `dotnet build` 恰好把
          #   $LASTEXITCODE 置为 0 ⇒ `&` 之后读到的永远是 0 ⇒ 门禁**恒绿**。
          #   探针真实退出码 1 也会被读成 0（探针根本没跑完就被判定为通过）。
          #   ⇒ 必须用 Start-Process -PassThru + WaitForExit 取**真实**退出码。
          # 路径含空格时必须**手工加引号**：Start-Process 的 -ArgumentList
          #   **不给**含空格的元素加引号 ⇒ 路径会被拆成多个 argv ⇒ 探针报
          #   "Unknown argument"（退出码 64）⇒ 门禁误报红。GitHub 托管 runner 的
          #   GITHUB_WORKSPACE 无空格，但自托管 runner / 本地含空格路径会命中。
          $proc = Start-Process -FilePath $probe -ArgumentList @('--scenario=startup', ('"{0}"' -f $out)) -PassThru -WindowStyle Hidden
          if (-not $proc.WaitForExit(180000)) {
            try { $proc.Kill() } catch { }
            throw '生产主窗体启动检查超时（180 s）'
          }
          $code = $proc.ExitCode
          Write-Host "生产主窗体启动检查退出码: $code"
          if ($code -ne 0) {
            $err = Join-Path $out 'startup-error.log'
            if (Test-Path -LiteralPath $err) { Write-Host '--- startup-error.log ---'; Get-Content -LiteralPath $err }
            throw "生产主窗体启动检查失败（退出码 $code）—— 退出码契约：0=构造成功 / 1=MainForm 构造期抛异常 / 2=环境不具备 / 64=参数错误"
          }

      # 第三方组件声明与实际依赖一致★
      #   脚本以**实际解析**的依赖为真值（还原图 + 目标框架冲突消解），
      #   核对 NOTICE 里声明的组件清单：
      #     · 直接依赖漏列 / 版本不符   ⇒ 退出码 1（流水线红）
      #     · 传递依赖漏列 / 版本不符   ⇒ 退出码 1（流水线红）
      #     · 环境受阻（取不到还原图等）⇒ 退出码 3（流水线红，结论不可信时不放行）
      #   手工维护的清单必然漂移 ⇒ 本步骤把依赖声明与实际依赖的一致性
      #   变成可持续的门禁：新增依赖而忘记改 NOTICE，会在这里被挡住。
      - name: Validate dependency manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'scripts/generate-dependency-manifest.ps1' -Mode Check
          if ($LASTEXITCODE -ne 0) { throw "Dependency manifest validation failed: exit $LASTEXITCODE" }

      - name: 清理历史测试结果
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $results = [IO.Path]::GetFullPath((Join-Path $workspace 'ci-artifacts/test-results'))
          if (-not $results.StartsWith($workspace.TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw '测试结果目录越界' }
          if (Test-Path -LiteralPath $results) { Remove-Item -LiteralPath $results -Recurse -Force }
          New-Item -ItemType Directory -Force -Path 'ci-artifacts' | Out-Null
          Write-Host '已清理双配置测试结果目录'

      - name: Run tests (Debug, Tier 3)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'scripts/run-tests.ps1' -Tier 3 -Configuration Debug -BaseOutputPath bin/ -NoBuild -ResultsDirectory 'ci-artifacts/test-results/Debug' |
            Tee-Object -FilePath 'ci-artifacts/test-Debug.log'
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "Debug Tier 3 failed: exit $code" }

      - name: Verify exact test inventory (Debug, Tier 3)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File '.github/workflows/assert-test-tiers.ps1' -ResultsRoot 'ci-artifacts/test-results/Debug' -Configuration Debug -Tier 3 -BaseOutputPath bin/
          if ($LASTEXITCODE -ne 0) { throw "Debug test inventory verification failed: exit $LASTEXITCODE" }

      - name: 构建（Release）
        shell: pwsh
        run: |
          & pwsh -NoProfile -File 'scripts/run-tests.ps1' -Configuration Release -BaseOutputPath bin/ -BuildOnly
          if ($LASTEXITCODE -ne 0) { throw "构建或产物身份记录失败（退出码 $LASTEXITCODE）" }

      - name: Run tests (Release, Tier 3)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'scripts/run-tests.ps1' -Tier 3 -Configuration Release -BaseOutputPath bin/ -NoBuild -ResultsDirectory 'ci-artifacts/test-results/Release' |
            Tee-Object -FilePath 'ci-artifacts/test-Release.log'
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "Release Tier 3 failed: exit $code" }

      - name: Verify exact test inventory (Release, Tier 3)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File '.github/workflows/assert-test-tiers.ps1' -ResultsRoot 'ci-artifacts/test-results/Release' -Configuration Release -Tier 3 -BaseOutputPath bin/
          if ($LASTEXITCODE -ne 0) { throw "Release test inventory verification failed: exit $LASTEXITCODE" }

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $json = Get-Content -LiteralPath 'resources/version.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $v = [string]$json.version
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'resources/version.json 里没有 version 字段' }
          Write-Host "版本号: $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 打包发布件并计算 SHA-256
        shell: pwsh
        env:
          PACK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:PACK_VERSION
          Write-Host "打包版本: $version"
          & pwsh -NoProfile -File 'scripts/pack-release.ps1' -Version $version -Brand 'LiteMonitorPlus' -OutDir 'dist'
          if ($LASTEXITCODE -ne 0) { throw "pack-release.ps1 失败（退出码 $LASTEXITCODE）" }
          $zip = "dist/LiteMonitorPlus_v$version-win-x64.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "发布包缺失: $zip" }
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item -LiteralPath $zip).Length
          Write-Host "ZIP    : $zip"
          Write-Host ("大小   : {0:N2} MB" -f ($size / 1MB))
          Write-Host "SHA256 : $sha"
          "sha256=$sha" >> $env:GITHUB_OUTPUT

      - name: 上传测试报告（TRX + 控制台日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ci-artifacts/test-results/**
            ci-artifacts/test-*.log
            ci-artifacts/startup-check/**
          if-no-files-found: error
          retention-days: 14

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/LiteMonitorPlus_v${{ steps.version.outputs.version }}-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════
  # 可空引用门禁（nullable-gate）
  #
  # 目的：保证「可空引用警告清零」是**持续可验证的工程不变量**。
  #   门禁 1（硬门禁）生产四工程 Release 构建**零警告**
  #             （LiteMonitor / LiteMonitor.Updater / HardwareHost / Contracts）
  #             → 由各 csproj 的 TreatWarningsAsErrors（Release 条件）实现。
  #   门禁 2（防回退）全解决方案**不新增**警告码
  #             → TreatWarningsAsErrors=true + WarningsNotAsErrors=<存量码清单>：
  #               存量债务降级为「警告但仍可见」，任何**新增**警告码一律升级为错误。
  #
  # 假绿禁令（当前口径）
  #   · 两条门禁都用 `dotnet build` 的**真实退出码**判定，禁止只看日志里有没有 "warning" 字样；
  #   · 门禁 2 禁止使用无差别全局 /warnaserror（会误伤存量债务导致门禁永久红灯）；
  #   · 禁止使用 `warnaserror:<code>` 写法 —— 编译器语义是「把这些码当作错误」，
  #     **不是**「豁免这些码」，语义完全相反。
  # ══════════════════════════════════════════════════════════════════════
  nullable-gate:
    name: 可空引用门禁（生产零警告）
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 还原依赖
        run: dotnet restore LiteMonitor.sln

      # ── 门禁 1：生产工程零警告（硬门禁）─────────────────────────────
      - name: 门禁 1 · 生产工程零警告（Release · warnings-as-errors）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            'src\Contracts\LiteMonitor.Contracts.csproj',
            'src\HardwareHost\LiteMonitor.HardwareHost.csproj',
            'LiteMonitor.csproj',
            'LiteMonitor.Updater\LiteMonitor.Updater.csproj'
          )
          foreach ($p in $projects) {
            Write-Host "==> 门禁 1：$p"
            # NU1900 = NuGet 拉取漏洞数据失败（源不可达/离线/缓存过期），属网络环境类告警，
            #   与代码质量无关，会被 -warnaserror 升级为 error 导致门禁「假红」。
            #   用 -p:NuGetAudit=false 关闭构建时的漏洞审计以消除 NU1900：
            #   · 不能用 -p:WarningsNotAsErrors=NU1900 —— NuGet 只认 NoWarn / WarningsAsErrors；
            #   · 也不能用 -p:NoWarn=NU1900 —— 它是 MSBuild 全局属性，会覆盖测试工程 csproj 内的
            #     <NoWarn>$(NoWarn);CS8632</NoWarn>，导致 CS8632 × 263 重新冒头。
            #   · 本作业的「还原依赖」步骤仍开着审计，真实漏洞（NU1902/NU1903）照常可见。
            dotnet build $p -c Release --no-dependencies --no-incremental --nologo -warnaserror '-p:NuGetAudit=false'
            if ($LASTEXITCODE -ne 0) {
              throw "门禁 1 失败：$p（退出码 $LASTEXITCODE）—— 生产工程在 Release 下出现编译警告，已按 TreatWarningsAsErrors 升级为错误。可空债务清零是本门禁的验收底线，不允许降级放行。"
            }
          }
          Write-Host '门禁 1 通过：四个生产工程 Release 构建 0 警告 0 错误。'

      # ── 门禁 2：全解决方案不新增警告码（防回退）─────────────────────
      - name: 门禁 2 · 全解决方案不新增警告码
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ★ 存量债务抑制清单：只登记**确实还存在**的警告码。
          #   每清理掉一个存量码，就从这里移除对应码，门禁 2 随之收紧。
          #   · CS0168 / CS0649：测试工程未使用变量 / 未赋值字段（测试代码风格，非可空缺陷）
          #   · CS8632：测试工程 Nullable=disable 下的标注噪音（已在测试 csproj 内 NoWarn）
          #   · xUnit 分析器：xUnit 分析器规则警告，与可空治理无因果关系
          #     （登记为独立技术债，不在可空治理范围内）
          # 分号必须写成 %3B：MSBuild 用 ";" 分隔多个属性，直接传 ";" 会报
          #    MSB1006（属性无效），实测确认。
          $legacy = 'CS0168%3BCS0649%3BCS8632%3BxUnit2031%3BxUnit1030%3BxUnit1031%3BxUnit2013%3BxUnit1026%3BxUnit2000%3BxUnit2012%3BxUnit2017%3BxUnit2020'
          dotnet build LiteMonitor.sln -c Release --no-incremental --nologo `
            -p:TreatWarningsAsErrors=true `
            -p:WarningsNotAsErrors=$legacy `
            -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) {
            throw "门禁 2 失败（退出码 $LASTEXITCODE）—— 全解决方案出现了**不在抑制清单内**的新警告码，已升级为错误。请修正代码，或在确属存量债务时把对应码登记进本步骤的抑制清单。"
          }
          Write-Host '门禁 2 通过：全解决方案未出现新增警告码。'
