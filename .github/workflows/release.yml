name: Release

# Manual release only. The workflow deliberately has no release-on-push path, so a
# merge cannot expose the update signing secret.
on:
  workflow_dispatch:
    inputs:
      release_date:
        description: 'Release date in YYYY-MM-DD; defaults to the current UTC date'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fast-validation:
    name: Hosted Debug and Release Tier 3 validation
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      LITEMONITOR_PLUGIN_REPO: ${{ github.workspace }}/tests/fixtures/plugin-repo
      LITEMONITOR_THEME_REPO: ${{ github.workspace }}/tests/fixtures/theme-repo
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

    steps:
      - name: Require master
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/master') {
            throw "Release must run from master; received $env:GITHUB_REF"
          }

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LiteMonitor.sln

      - name: Build Debug and record identity
        shell: pwsh
        run: |
          & pwsh -NoProfile -File 'scripts/run-tests.ps1' -Configuration Debug -BaseOutputPath bin/ -BuildOnly
          if ($LASTEXITCODE -ne 0) { throw "Debug build failed: exit $LASTEXITCODE" }

      - name: Production MainForm startup check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 独立 BaseOutputPath：全局属性级联到全部被引用工程，避免这次构建重写
          # BuildOnly 记录的构建身份所锚定的根 bin/Debug（check-stamp 会比对产物 hash）。
          dotnet build tools/GpuHostLifecycleProbe/GpuHostLifecycleProbe.csproj -c Debug --nologo -v quiet -p:BaseOutputPath=bin/probe/
          if ($LASTEXITCODE -ne 0) { throw "Startup probe build failed: exit $LASTEXITCODE" }

          $out = Join-Path $env:GITHUB_WORKSPACE 'ci-artifacts/startup-check'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $probe = Join-Path $env:GITHUB_WORKSPACE 'tools/GpuHostLifecycleProbe/bin/probe/Debug/net8.0-windows/GpuHostLifecycleProbe.exe'
          $process = Start-Process -FilePath $probe -ArgumentList @('--scenario=startup', ('"{0}"' -f $out)) -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(180000)) {
            try { $process.Kill() } catch { }
            throw 'Startup check timed out after 180 seconds'
          }
          if ($process.ExitCode -ne 0) {
            $errorLog = Join-Path $out 'startup-error.log'
            if (Test-Path -LiteralPath $errorLog) {
              Write-Host '--- startup-error.log ---'
              Get-Content -LiteralPath $errorLog
            }
            throw "Startup check failed with exit code $($process.ExitCode)"
          }

      - name: Validate dependency manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'scripts/generate-dependency-manifest.ps1' -Mode Check
          if ($LASTEXITCODE -ne 0) { throw "Dependency manifest validation failed: exit $LASTEXITCODE" }

      - name: Reset test result directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'ci-artifacts/test-results'))
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          if (-not $results.StartsWith($workspace.TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Test result path escaped GITHUB_WORKSPACE'
          }
          if (Test-Path -LiteralPath $results) { Remove-Item -LiteralPath $results -Recurse -Force }
          New-Item -ItemType Directory -Force -Path 'ci-artifacts' | Out-Null

      - name: Run tests (Debug, Tier 3)
        shell: pwsh
        run: |
          & pwsh -NoProfile -File 'scripts/run-tests.ps1' -Tier 3 -Configuration Debug -BaseOutputPath bin/ -NoBuild -ResultsDirectory 'ci-artifacts/test-results/Debug' |
            Tee-Object -FilePath 'ci-artifacts/test-Debug.log'
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "Debug Tier 3 failed: exit $code" }

      - name: Verify exact test inventory (Debug, Tier 3)
        shell: pwsh
        run: |
          & pwsh -NoProfile -File '.github/workflows/assert-test-tiers.ps1' -ResultsRoot 'ci-artifacts/test-results/Debug' -Configuration Debug -Tier 3 -BaseOutputPath bin/
          if ($LASTEXITCODE -ne 0) { throw "Debug test inventory verification failed: exit $LASTEXITCODE" }

      - name: Build Release and record identity
        shell: pwsh
        run: |
          & pwsh -NoProfile -File 'scripts/run-tests.ps1' -Configuration Release -BaseOutputPath bin/ -BuildOnly
          if ($LASTEXITCODE -ne 0) { throw "Release build failed: exit $LASTEXITCODE" }

      - name: Run tests (Release, Tier 3)
        shell: pwsh
        run: |
          & pwsh -NoProfile -File 'scripts/run-tests.ps1' -Tier 3 -Configuration Release -BaseOutputPath bin/ -NoBuild -ResultsDirectory 'ci-artifacts/test-results/Release' |
            Tee-Object -FilePath 'ci-artifacts/test-Release.log'
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "Release Tier 3 failed: exit $code" }

      - name: Verify exact test inventory (Release, Tier 3)
        shell: pwsh
        run: |
          & pwsh -NoProfile -File '.github/workflows/assert-test-tiers.ps1' -ResultsRoot 'ci-artifacts/test-results/Release' -Configuration Release -Tier 3 -BaseOutputPath bin/
          if ($LASTEXITCODE -ne 0) { throw "Release test inventory verification failed: exit $LASTEXITCODE" }

      - name: Upload fast validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-fast-validation
          path: |
            ci-artifacts/test-results/**
            ci-artifacts/test-*.log
            ci-artifacts/startup-check/**
          if-no-files-found: error
          retention-days: 14

  system-validation:
    name: Capable-runner Tier 4 and Tier 5 validation
    needs: fast-validation
    runs-on: [self-hosted, Windows, X64, LiteMonitor-SystemValidation]
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      LITEMONITOR_PLUGIN_REPO: ${{ github.workspace }}/tests/fixtures/plugin-repo
      LITEMONITOR_THEME_REPO: ${{ github.workspace }}/tests/fixtures/theme-repo
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LiteMonitor.sln

      - name: Build Release for system validation
        shell: pwsh
        run: |
          & pwsh -NoProfile -File 'scripts/run-tests.ps1' -Configuration Release -BaseOutputPath bin/ -BuildOnly
          if ($LASTEXITCODE -ne 0) { throw "Release build failed: exit $LASTEXITCODE" }

      - name: Run tests (Release, exact Tier 4)
        shell: pwsh
        run: |
          & pwsh -NoProfile -File 'scripts/run-tests.ps1' -Tier 4 -ExactTier -Configuration Release -BaseOutputPath bin/ -NoBuild -ResultsDirectory 'ci-artifacts/test-results/Tier4' -Capabilities Desktop,Gpu,Hardware -RequiredCapabilities Desktop,Gpu,Hardware |
            Tee-Object -FilePath 'ci-artifacts/test-Tier4.log'
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "System validation Tier 4 failed: exit $code" }

      - name: Verify exact test inventory (Release, exact Tier 4)
        shell: pwsh
        run: |
          & pwsh -NoProfile -File '.github/workflows/assert-test-tiers.ps1' -ResultsRoot 'ci-artifacts/test-results/Tier4' -Configuration Release -Tier 4 -ExactTier -BaseOutputPath bin/ -RequiredCapabilities Desktop,Gpu,Hardware
          if ($LASTEXITCODE -ne 0) { throw "Tier 4 test inventory verification failed: exit $LASTEXITCODE" }

      - name: Run tests (Release, exact Tier 5)
        shell: pwsh
        run: |
          # Tier 5 清单中没有任何 Hardware 能力用例（唯一的 Hardware 用例在 Tier 4），
          # RequiredCapabilities 带 Hardware 会让目录工具直接抛"无匹配校验"而失败。
          & pwsh -NoProfile -File 'scripts/run-tests.ps1' -Tier 5 -ExactTier -Configuration Release -BaseOutputPath bin/ -NoBuild -ResultsDirectory 'ci-artifacts/test-results/Tier5' -Capabilities Desktop,Gpu,Hardware -RequiredCapabilities Desktop,Gpu |
            Tee-Object -FilePath 'ci-artifacts/test-Tier5.log'
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "System validation Tier 5 failed: exit $code" }

      - name: Verify exact test inventory (Release, exact Tier 5)
        shell: pwsh
        run: |
          & pwsh -NoProfile -File '.github/workflows/assert-test-tiers.ps1' -ResultsRoot 'ci-artifacts/test-results/Tier5' -Configuration Release -Tier 5 -ExactTier -BaseOutputPath bin/ -RequiredCapabilities Desktop,Gpu
          if ($LASTEXITCODE -ne 0) { throw "Tier 5 test inventory verification failed: exit $LASTEXITCODE" }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionJson = Get-Content -LiteralPath 'resources/version.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $version = [string]$versionJson.version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'resources/version.json has no version' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build unsigned release ZIP and SHA-256
        shell: pwsh
        env:
          PACK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File 'scripts/pack-release.ps1' -Version $env:PACK_VERSION -Brand 'LiteMonitorPlus' -OutDir 'dist'
          if ($LASTEXITCODE -ne 0) { throw "pack-release.ps1 failed: exit $LASTEXITCODE" }

          $name = "LiteMonitorPlus_v$env:PACK_VERSION-win-x64.zip"
          $zip = Join-Path 'dist' $name
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Release ZIP is missing: $zip" }
          $sha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $zip).Length
          $manifest = [ordered]@{
            schemaVersion = 1
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            ref = $env:GITHUB_REF
            version = $env:PACK_VERSION
            file = $name
            sha256 = $sha256
            size = $size
            tiers = @(4, 5)
            exactTier = $true
            capabilities = @('Desktop', 'Gpu', 'Hardware')
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'dist/validated-release-manifest.json' -Encoding utf8
          "$sha256  $name" | Set-Content -LiteralPath 'dist/validated-release.sha256' -Encoding ascii

      - name: Upload validated unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: validated-release
          path: |
            dist/LiteMonitorPlus_v${{ steps.version.outputs.version }}-win-x64.zip
            dist/validated-release-manifest.json
            dist/validated-release.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload system validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-system-validation
          path: |
            ci-artifacts/test-results/**
            ci-artifacts/test-*.log
          if-no-files-found: error
          retention-days: 14

  release:
    name: Verify, sign, and publish the validated artifact
    needs: [fast-validation, system-validation]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Require master
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/master') {
            throw "Release must run from master; received $env:GITHUB_REF"
          }

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download validated unsigned release
        uses: actions/download-artifact@v4
        with:
          name: validated-release
          path: dist

      - name: Verify same-commit artifact digest
        id: artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = 'dist/validated-release-manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw 'Validated release manifest is missing' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([int]$manifest.schemaVersion -ne 1) { throw 'Unsupported validated release manifest schema' }
          if ([string]$manifest.repository -cne $env:GITHUB_REPOSITORY) { throw 'Validated artifact belongs to another repository' }
          if ([string]$manifest.commit -cne $env:GITHUB_SHA) { throw 'Validated artifact belongs to another commit' }
          if ([string]$manifest.ref -cne $env:GITHUB_REF) { throw 'Validated artifact belongs to another ref' }
          if (-not [bool]$manifest.exactTier -or (@($manifest.tiers) -join ',') -ne '4,5') { throw 'Validated artifact lacks exact Tier 4 and Tier 5 evidence' }
          if ((@($manifest.capabilities | Sort-Object) -join ',') -ne 'Desktop,Gpu,Hardware') { throw 'Validated artifact lacks required capability evidence' }

          $file = [string]$manifest.file
          if ([string]::IsNullOrWhiteSpace($file) -or [IO.Path]::GetFileName($file) -cne $file) { throw 'Validated artifact file name is invalid' }
          $zip = Join-Path 'dist' $file
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Validated release ZIP is missing: $zip" }
          if ([long](Get-Item -LiteralPath $zip).Length -ne [long]$manifest.size) { throw 'Validated release ZIP size does not match its manifest' }
          $actualSha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -cne [string]$manifest.sha256) { throw 'Validated release ZIP digest does not match its manifest' }
          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT

      - name: Resolve release date
        id: release_date
        shell: pwsh
        env:
          RELEASE_DATE_INPUT: ${{ inputs.release_date }}
        run: |
          $ErrorActionPreference = 'Stop'
          $date = ([string]$env:RELEASE_DATE_INPUT).Trim()
          if ([string]::IsNullOrWhiteSpace($date)) { $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd') }
          if ($date -notmatch '^\d{4}-\d{2}-\d{2}$') { throw "Invalid release date: $date" }
          "date=$date" >> $env:GITHUB_OUTPUT

      - name: Prepare signing key in runner temp
        shell: pwsh
        env:
          SIGNING_KEY_B64: ${{ secrets.UPDATE_SIGNING_KEY_PKCS8 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY_B64)) {
            throw 'Missing GitHub secret UPDATE_SIGNING_KEY_PKCS8'
          }
          try { $keyBytes = [Convert]::FromBase64String($env:SIGNING_KEY_B64.Trim()) }
          catch { throw 'UPDATE_SIGNING_KEY_PKCS8 must be base64-encoded PKCS#8 DER' }
          if ($keyBytes.Length -lt 32) { throw 'Signing key payload is implausibly short' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'update-signing-key.pkcs8'
          [IO.File]::WriteAllText($keyPath, $env:SIGNING_KEY_B64.Trim(), [Text.UTF8Encoding]::new($false))

      - name: Sign validated ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath 'dist/validated-release-manifest.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $version = [string]$manifest.version
          $zip = Join-Path 'dist' ([string]$manifest.file)
          $keyPath = Join-Path $env:RUNNER_TEMP 'update-signing-key.pkcs8'
          & pwsh -NoProfile -File 'scripts/sign-release.ps1' -ZipPath $zip -Version $version -ReleaseDate '${{ steps.release_date.outputs.date }}' -KeyPath $keyPath
          if ($LASTEXITCODE -ne 0) { throw "sign-release.ps1 failed: exit $LASTEXITCODE" }

          $signedSha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($signedSha256 -cne [string]$manifest.sha256) {
            throw 'Signed artifact no longer matches the system-validated digest'
          }

      - name: Verify signature with embedded public key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath 'dist/validated-release-manifest.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $zip = Join-Path 'dist' ([string]$manifest.file)
          & pwsh -NoProfile -File '.github/workflows/verify-release-signature.ps1' -VersionJsonPath 'resources/version.json' -ZipPath $zip
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: exit $LASTEXITCODE" }

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            resources/version.json
            dist/validated-release-manifest.json
            dist/validated-release.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.artifact.outputs.version }}
          name: LiteMonitorPlus v${{ steps.artifact.outputs.version }}
          draft: true
          prerelease: false
          files: dist/LiteMonitorPlus_v${{ steps.artifact.outputs.version }}-win-x64.zip
          fail_on_unmatched_files: true

      - name: Remove signing key
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'update-signing-key.pkcs8'
          if (Test-Path -LiteralPath $keyPath) {
            Remove-Item -LiteralPath $keyPath -Force
          }
